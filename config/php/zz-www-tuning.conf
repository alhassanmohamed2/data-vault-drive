; ==============================================================================
; PHP-FPM Worker Pool Tuned for 4 vCPU / 2 GB Container Limit (5-50 Users)
; ==============================================================================
[www]
pm = dynamic
pm.max_children = 24
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 12
pm.max_requests = 500
request_terminate_timeout = 3600
clear_env = no
