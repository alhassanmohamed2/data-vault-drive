# ==============================================================================
# Host-Wide Nginx Reverse Proxy Config for Company Files Vault (Cloudflare SSL)
# Place in: /etc/nginx/sites-available/company-files-vault.conf
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_SUBDOMAIN_HERE;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_SUBDOMAIN_HERE;

    # Path to your existing Cloudflare Origin SSL Certificate on the VPS
    ssl_certificate     /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Allow large file uploads (16 GB) without Nginx buffering timeouts
    client_max_body_size 16G;
    fastcgi_buffers 64 4K;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 3600s;

    # Forward real visitor IP from Cloudflare to Nextcloud & Audit Console
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

    # Support WebSockets for Collabora Online (Live Word/Excel/PPT editing)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";

    location / {
        proxy_pass http://127.0.0.1:18440;
    }
}
